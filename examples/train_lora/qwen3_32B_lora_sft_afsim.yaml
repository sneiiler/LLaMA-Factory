### model
model_name_or_path: /mnt/saves-wu-nas/shifan/kaifeng/models/DistillQwen-ThoughtY-32B
# trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target: all
deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: distill_qwen_data_5k, afsim_code_explain_v1, afsim_data_doc_v1, afsim_data_code_v1_1, omni_thought_10k_cd7, afsim_data_code_v1, identity_afsim
template: qwen3
cutoff_len: 8192
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/DistillQwen-ThoughtY-32B/lora/afsim_sft_0719
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 7.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

